name: Compilar Refaccionaria para Windows 11

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restaurar dependencias
        run: dotnet restore RefaccionariaDesktop.csproj
      - name: Compilar ejecutable autocontenido
        run: >-
          dotnet publish RefaccionariaDesktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output publish
      - name: Publicar EXE como artefato descargable
        uses: actions/upload-artifact@v4
        with:
          name: RefaccionariaDesktop-Windows-x64
          path: publish/RefaccionariaDesktop.exe
          if-no-files-found: error
          retention-days: 14