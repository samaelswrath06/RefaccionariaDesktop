name: Compilar Refaccionaria para Windows 11

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restaurar dependencias
        run: dotnet restore RefaccionariaDesktop.csproj
      - name: Compilar ejecutable autocontenido
        run: >-
          dotnet publish RefaccionariaDesktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output publish
      - name: Comprobar que el proceso inicia
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "publish/RefaccionariaDesktop.exe"
          if (-not (Test-Path $exe)) { throw "No se generó RefaccionariaDesktop.exe" }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "La aplicación terminó durante la prueba de inicio. Código de salida: $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
      - name: Publicar EXE como artefacto descargable
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: RefaccionariaDesktop-Windows-x64
          path: publish/RefaccionariaDesktop.exe
          if-no-files-found: error
          retention-days: 14